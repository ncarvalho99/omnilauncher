# Static-only catalog service.  Theme archives are published by the isolated
# ingestion worker; nginx never accepts uploads or executes submitted files.
limit_req_zone $binary_remote_addr zone=themes:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=themesconn:10m;

# Official-client gate for theme packages. The keys file holds one line per
# accepted key (`"<key>" 1;`) and lives outside the repository, mode 0640.
# The website and the console share the catalog JSON and previews, so only the
# large package archives are gated.
map_hash_bucket_size 128;
map $http_x_switchu_key $switchu_client_ok {
    default 0;
    include /etc/nginx/switchu/client-keys.map;
}
map $http_x_omnilaunch_key $omnilaunch_client_ok {
    default 0;
    include /etc/nginx/switchu/client-keys.map;
}
log_format switchu_packages '$remote_addr [$time_local] "$request" $status $body_bytes_sent client_ok=$switchu_client_ok';

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /srv/themes;
    index index.html;
    charset utf-8;

    # Restore real client IP from Cloudflare Tunnel and local trusted proxies
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 192.0.2.0/24;      # EXAMPLE (RFC 5737): replace with your reverse-proxy/tunnel network
    set_real_ip_from 198.51.100.0/24;   # EXAMPLE (RFC 5737): replace with your LAN network
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=themes burst=60 nodelay;
    limit_conn themesconn 32;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    include /etc/nginx/snippets/switchu-security-headers.conf;

    location = /index.html { include /etc/nginx/snippets/switchu-security-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /index.json { include /etc/nginx/snippets/switchu-security-headers.conf; default_type application/json; add_header Cache-Control "no-cache" always; }
    location = /review.json { include /etc/nginx/snippets/switchu-security-headers.conf; default_type application/json; add_header Cache-Control "no-cache" always; }
    # Mode file contains exactly `set $switchu_enforce 0;` (monitor) or
    # `set $switchu_enforce 1;` (enforce).
    include /etc/nginx/switchu/client-auth-mode.conf;
    location ~* ^/themes/.+\.zip$ {
        include /etc/nginx/snippets/switchu-security-headers.conf;
        # Cloudflare caches .zip by default and answers hits without asking the
        # origin, which would let unkeyed clients past the gate.
        add_header Cache-Control "private, no-store" always;
        access_log /var/log/nginx/switchu-packages.log switchu_packages;
        set $key_valid "${switchu_client_ok}${omnilaunch_client_ok}";
        set $any_client_ok 0;
        if ($key_valid ~ "1") { set $any_client_ok 1; }
        set $switchu_gate "${switchu_enforce}${any_client_ok}";
        if ($switchu_gate = "10") { return 401; }
        try_files $uri =404;
    }
    location ^~ /assets/ { include /etc/nginx/snippets/switchu-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
    location / { autoindex off; try_files $uri $uri/ =404; }
}
