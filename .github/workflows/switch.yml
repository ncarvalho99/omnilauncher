name: Switch build

# Nothing below is compiled into the build, so a push that only touches these
# has nothing to verify. The '[ci skip]' guard on the job still exists for the
# cases a path filter cannot see, but relying on it meant remembering it, and a
# changelog-only commit burned a full matrix because nobody did.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.logs/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.logs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip')
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    strategy:
      fail-fast: false
      matrix:
        mode:
          - debug
          - release
        variant:
          - homebrew
          - sysmodule

    steps:
      - name: Get current date as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # zstd: local-repo's libsdl extracts a .pkg.tar.zst with tar --zstd.
      # tools/Dockerfile.build installs it for the same reason.
      - name: Install system dependencies
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get -y install gcc g++ zip zstd
          else
            apt-get update
            apt-get -y install gcc g++ zip zstd
          fi

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      # libstratosphere accounts for ~20 of the ~21 minutes a sysmodule job
      # takes, and it is rebuilt from scratch every run because the submodule is
      # checked out fresh. Its output only changes when the submodule moves, so
      # key the cache on that commit.
      - name: Resolve libstratosphere revision
        if: matrix.variant == 'sysmodule'
        id: strat
        shell: bash
        run: echo "sha=$(git -C lib/Atmosphere-libs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache libstratosphere
        if: matrix.variant == 'sysmodule'
        uses: actions/cache@v4
        with:
          path: lib/Atmosphere-libs/libstratosphere/lib
          key: stratosphere-${{ steps.strat.outputs.sha }}-${{ matrix.mode }}

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        shell: bash
        run: |
          xmake repo --update --root
          xmake repo -u --root

      - name: Configure xmake
        shell: bash
        env:
          SWITCHU_CLIENT_KEY: ${{ secrets.SWITCHU_CLIENT_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          KEY_FLAG=""
          if [ -z "$SWITCHU_CLIENT_KEY" ]; then
            # Fork pull requests get no secrets and only need to compile. Any
            # other build (push, release, manual) without the key would ship a
            # client the servers reject, so it must fail instead of succeeding.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              KEY_FLAG="--allow_no_client_key=y"
            else
              echo "SWITCHU_CLIENT_KEY secret is missing; refusing to build without the official client key" >&2
              exit 1
            fi
          fi
          if [ "${{ matrix.variant }}" = "homebrew" ]; then
            xmake f --yes -p cross -m "${{ matrix.mode }}" -a aarch64 --toolchain=devkita64 --homebrew=y $KEY_FLAG -vD --root
          else
            xmake f --yes -p cross -m "${{ matrix.mode }}" -a aarch64 --toolchain=devkita64 $KEY_FLAG -vD --root
          fi

      - name: Build OmniLaunch
        env:
          SWITCHU_CLIENT_KEY: ${{ secrets.SWITCHU_CLIENT_KEY }}
        run: xmake -vD --root

      - name: Package install layout
        run: xmake install -o "dist/${{ matrix.variant }}/${{ matrix.mode }}" --root

      - name: Create sysmodule zip
        if: matrix.variant == 'sysmodule'
        shell: bash
        run: |
          repo_root="$PWD"
          package_root="dist/sysmodule/${{ matrix.mode }}"
          archive_path="$repo_root/artifacts/OmniLaunch-sysmodule-${{ matrix.mode }}.zip"

          test -d "$package_root/atmosphere"
          test -d "$package_root/switch"

          mkdir -p "$repo_root/artifacts"
          cd "$package_root"
          zip -r "$archive_path" atmosphere switch

      - name: Upload homebrew artifact
        if: matrix.variant == 'homebrew'
        uses: actions/upload-artifact@v5
        with:
          name: OmniLaunch-homebrew-${{ matrix.mode }}
          if-no-files-found: error
          path: |
            build/cross/aarch64/${{ matrix.mode }}/SwitchU.nro
            dist/homebrew/${{ matrix.mode }}/

      - name: Upload sysmodule artifact
        if: matrix.variant == 'sysmodule'
        uses: actions/upload-artifact@v5
        with:
          name: OmniLaunch-sysmodule-${{ matrix.mode }}
          if-no-files-found: error
          path: artifacts/OmniLaunch-sysmodule-${{ matrix.mode }}.zip

      # Linked ELFs, kept out of the install payload above. ns_debug.sh needs
      # one of these to resolve addresses in an atmosphere/crash_reports log:
      #   ./ns_debug.sh local SwitchU 0169...log
      # The .nso/.nro the console actually runs is generated from these, so
      # they must come from the same run as the build being debugged.
      - name: Upload ELF symbols
        uses: actions/upload-artifact@v5
        with:
          name: SwitchU-symbols-${{ matrix.variant }}-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            build/cross/aarch64/${{ matrix.mode }}/SwitchU
            build/cross/aarch64/${{ matrix.mode }}/switchu-daemon